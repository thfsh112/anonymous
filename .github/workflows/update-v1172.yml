             <div class="modal share-modal">
          @@ -3486,7 +3486,27 @@
           async function getVerifiedAdmin(){const {data:userData,error:userError}=await supabase.auth.getUser();if(userError||!userData.user)return null;const {data:adminRow,error:adminError}=await supabase.from("site_admins").select("user_id").eq("user_id",userData.user.id).maybeSingle();if(adminError||!adminRow)return null;return userData.user}
           async function openAdmin(){const user=await getVerifiedAdmin();if(!user){$("#loginPanel").classList.remove("hidden");$("#adminMain").classList.add("hidden");return}$("#loginPanel").classList.add("hidden");$("#adminMain").classList.remove("hidden");$("#adminIdentity").textContent=user.email||"管理員";await Promise.all([loadMessages(),loadSettings()]);startRealtime()}
           $("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginError").classList.add("hidden");$("#loginBtn").disabled=true;$("#loginBtn").textContent="登入中…";const email=$("#loginEmail").value.trim(),password=$("#loginPassword").value;const {error}=await supabase.auth.signInWithPassword({email,password});if(error){$("#loginError").textContent="Email 或密碼錯誤。";$("#loginError").classList.remove("hidden");$("#loginBtn").disabled=false;$("#loginBtn").textContent="登入";return}const admin=await getVerifiedAdmin();if(!admin){await supabase.auth.signOut();$("#loginError").textContent="此帳號沒有後台管理權限。";$("#loginError").classList.remove("hidden");$("#loginBtn").disabled=false;$("#loginBtn").textContent="登入";return}$("#loginPassword").value="";$("#loginBtn").disabled=false;$("#loginBtn").textContent="登入";await openAdmin()});
