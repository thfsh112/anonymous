name: Update anonymous to v1.17.2

on:
  push:
    paths:
      - '.github/workflows/update-v1172.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html and service worker
        shell: bash
        run: |
          cat > /tmp/v1172.patch <<'PATCH'
          --- a/index.html
          +++ b/index.html
          @@ -2866,13 +2866,13 @@
               </div>
           
               <div class="app-help-box" id="pwaHelpBox">
