          +      通知內容只會顯示「你收到一則新的匿名訊息」，不會把匿名投稿正文顯示在鎖定畫面。登出後會同步取消這台裝置的通知訂閱。
               </div>
             </div>
           </section>
           </div></div></section>
           </main>
          -<button class="version-entry" id="versionEntry" type="button" aria-label="版本資訊">v1.17.1</button>
          +<button class="version-entry" id="versionEntry" type="button" aria-label="版本資訊">v1.17.2</button>
           <div class="toast" id="toast"></div>
