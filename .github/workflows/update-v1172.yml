           async function loadMessages(){const {data,error}=await supabase.from("messages").select("id,content,created_at,read_at,is_favorite,tracking_code,deletion_requested_at,image_path").order("created_at",{ascending:false}).limit(300);if(error){console.error(error);$("#messageList").innerHTML=`<div class="empty">無法讀取收件箱。</div>`;return}messages=data||[];renderMessages()}
           function renderMessages(){
             const unread=messages.filter(m=>!m.read_at).length;
          @@ -4103,6 +4123,39 @@
             }
           }
           
          +async function detachCurrentDevicePush(deleteServerRow=false){
          +  try{
          +    const subscription=await getCurrentPushSubscription();
          +    if(!subscription)return true;
          +
          +    // Explicit logout / "disable notifications" happens while auth is still valid,
          +    // so remove only this device's row before signing out.
          +    if(deleteServerRow){
          +      try{
          +        await supabase
          +          .from("push_subscriptions")
          +          .delete()
          +          .eq("endpoint",subscription.endpoint);
          +      }catch(error){
          +        console.warn("push_server_row_delete_failed",error);
          +      }
          +    }
          +
          +    // Browser / Apple Push subscription is independent from Supabase Auth.
          +    // Unsubscribe locally so a logged-out device cannot keep receiving pushes.
          +    try{
          +      await subscription.unsubscribe();
          +    }catch(error){
          +      console.warn("push_local_unsubscribe_failed",error);
          +    }
          +
          +    return true;
          +  }catch(error){
          +    console.warn("detach_push_failed",error);
          +    return false;
          +  }
          +}
          +
           async function refreshPwaPanel(){
             const installBadge=$("#pwaInstallBadge");
             const installText=$("#pwaInstallText");
          @@ -4260,11 +4313,7 @@
           
           $("#disablePushBtn").addEventListener("click",async()=>{
             try{
          -    const subscription=await getCurrentPushSubscription();
          -    if(subscription){
          -      await supabase.from("push_subscriptions").delete().eq("endpoint",subscription.endpoint);
          -      await subscription.unsubscribe();
          -    }
          +    await detachCurrentDevicePush(true);
               toast("通知已關閉");
               await refreshPwaPanel();
             }catch(error){
          @@ -4834,12 +4883,31 @@
             if(e.target===$("#storyDialog"))$("#storyDialog").close();
           });
           supabase.auth.onAuthStateChange(async event=>{
          -  if(event==="SIGNED_OUT"&&realtimeChannel){
          -    await supabase.removeChannel(realtimeChannel);
          -    realtimeChannel=null;
          +  if(event==="SIGNED_OUT"){
          +    if(realtimeChannel){
          +      await supabase.removeChannel(realtimeChannel);
          +      realtimeChannel=null;
          +    }
          +
          +    // Covers expired/revoked sessions and sign-out from another flow.
          +    // At this point auth may already be gone, so local unsubscribe is the reliable fallback.
          +    await detachCurrentDevicePush(false);
             }
           });
           await registerPwa();
          +
          +// Migration safety for older versions:
          +// if a device had Push enabled and was already logged out before v1.17.2,
          +// opening the updated site/PWA will remove that leftover local subscription.
          +try{
          +  const {data:{session}}=await supabase.auth.getSession();
          +  if(!session){
          +    await detachCurrentDevicePush(false);
          +  }
          +}catch(error){
          +  console.warn("startup_push_cleanup_failed",error);
          +}
          +
           await loadSettings();
           animateHomeEntrance();
           </script>
          PATCH

          git apply /tmp/v1172.patch
          sed -i 's/anonymous-mailbox-v1\.17\.1/anonymous-mailbox-v1.17.2/g' service-worker.js

          grep -q 'v1.17.2' index.html
          grep -q 'detachCurrentDevicePush' index.html
          grep -q 'anonymous-mailbox-v1.17.2' service-worker.js

      - name: Commit update
        shell: bash
        run: |
          rm -f .github/workflows/update-v1172.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js .github/workflows/update-v1172.yml
          git commit -m 'Update anonymous mailbox to v1.17.2'
          git push
