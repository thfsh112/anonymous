name: Run v1.18.3 patch
on:
  push:
    paths:
      - '.github/workflows/update-v1183-run.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/update_v1183.py
      - name: Validate JavaScript
        run: node --check /tmp/check.js
      - name: Commit update
        run: |
          git config user.name "thfsh112"
          git config user.email "marsmars1000507@gmail.com"
          git rm .github/update_v1183.py .github/workflows/update-v1183-run.yml
          git add index.html service-worker.js
          git commit -m "Update anonymous mailbox to v1.18.3"
          git push
