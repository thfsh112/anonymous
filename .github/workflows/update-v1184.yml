    paths:
      - '.github/workflows/update-v1184.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.18.4
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update.py
          python3 /tmp/update.py
          node --check /tmp/check.js
      - name: Commit v1.18.4
        shell: bash
        run: |
          git config user.name "thfsh112"
          git config user.email "marsmars1000507@gmail.com"
          git rm .github/workflows/update-v1184.yml
