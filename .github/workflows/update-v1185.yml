name: Apply v1.18.5 share text styles
on:
  push:
    paths:
      - '.github/workflows/update-v1185.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated patch
        run: git apply .github/update_v1185.patch
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('module script missing')
          js=m.group(1)
          js=re.sub(r'import\s+\{\s*createClient\s*\}\s+from\s+"[^"]+";','const createClient=(...args)=>({});',js,count=1)
          Path('/tmp/check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Update PWA cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          if 'anonymous-mailbox-v1.18.4' not in s:
              raise SystemExit('service worker version marker missing')
          p.write_text(s.replace('anonymous-mailbox-v1.18.4','anonymous-mailbox-v1.18.5',1),encoding='utf-8')
          PY
      - name: Commit v1.18.5
        shell: bash
        run: |
          git config user.name "thfsh112"
          git config user.email "marsmars1000507@gmail.com"
          git rm .github/update_v1185.patch .github/workflows/update-v1185.yml
          [ -f .github/update_v1183.py ] && git rm .github/update_v1183.py || true
          [ -f .github/workflows/update-v1183-run.yml ] && git rm .github/workflows/update-v1183-run.yml || true
          git add index.html service-worker.js
          git commit -m "Update anonymous mailbox to v1.18.5"
          git push
