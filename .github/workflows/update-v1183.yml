name: Update anonymous to v1.18.3
on:
  push:
    paths:
      - '.github/workflows/update-v1183.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch account maintenance visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '>v1.18.2</button>' not in s:
              raise SystemExit('version marker missing')
          s=s.replace('>v1.18.2</button>','>v1.18.3</button>',1)

          css='''\n/* ===== v1.18.3 後台分頁可見性 ===== */\n#mainTabs{flex-wrap:wrap;overflow:visible}\n#mainTabs .tab{flex:0 0 auto}\n#accountsTab:not(.hidden){display:inline-flex}\n'''
          if '/* ===== v1.18.3 後台分頁可見性 ===== */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          old='''  $("#adminIdentity").textContent=user.email||"管理員";\n  await Promise.all([loadMessages(),loadSettings()]);\n  const role=await loadAdminRole();\n  $("#adminIdentity").textContent=`${currentAdminName}管理員 · ${user.email||"管理員"}${role==="owner"?" · Owner":""}`;\n  startRealtime();'''
          new='''  $("#adminIdentity").textContent=user.email||"管理員";\n  const role=await loadAdminRole();\n  $("#adminIdentity").textContent=`${currentAdminName}管理員 · ${user.email||"管理員"}${role==="owner"?" · Owner":""}`;\n  await Promise.allSettled([loadMessages(),loadSettings()]);\n  startRealtime();'''
          if old not in s:
              raise SystemExit('openAdmin marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Update service worker cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          if 'anonymous-mailbox-v1.18.2' not in s:
              raise SystemExit('service worker version marker missing')
          p.write_text(s.replace('anonymous-mailbox-v1.18.2','anonymous-mailbox-v1.18.3',1),encoding='utf-8')
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script missing')
          js=m.group(1)
          js=re.sub(r'import\s+\{\s*createClient\s*\}\s+from\s+"[^"]+";','const createClient=(...args)=>({});',js,count=1)
          Path('/tmp/check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit update
        shell: bash
        run: |
          git config user.name "thfsh112"
          git config user.email "marsmars1000507@gmail.com"
          git rm .github/workflows/update-v1183.yml
          git add index.html service-worker.js
          git commit -m "Update anonymous mailbox to v1.18.3"
          git push
