name: Update anonymous to v1.18.10
on:
  push:
    paths:
      - '.github/workflows/update-v11810.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply per-device push preference update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def need(cond,msg):
              if not cond:
                  raise SystemExit(msg)

          need('>v1.18.9</button>' in s,'v1.18.9 version marker missing')
          s=s.replace('>v1.18.9</button>','>v1.18.10</button>',1)

          s=s.replace('<strong>新匿名訊息通知</strong>','<strong>這台裝置的新匿名訊息通知</strong>',1)
          s=s.replace('<button class="primary" id="enablePushBtn" type="button">開啟通知</button>','<button class="primary" id="enablePushBtn" type="button">開啟此裝置</button>',1)
          s=s.replace('<button class="secondary hidden" id="disablePushBtn" type="button">關閉通知</button>','<button class="secondary hidden" id="disablePushBtn" type="button">關閉此裝置</button>',1)
          old_help='通知內容只會顯示「你收到一則新的匿名訊息」，不會把匿名投稿正文顯示在鎖定畫面。登出後會同步取消這台裝置的通知訂閱。'
          new_help='通知內容只會顯示「你收到一則新的匿名訊息」，不會把匿名投稿正文顯示在鎖定畫面。每台手機／裝置會各自保存自己的通知開關；同一帳號在其他裝置的設定不受影響。登出時會暫停這台裝置推播，重新登入同一帳號後會依這台裝置原本設定自動恢復。'
          need(old_help in s,'push help marker missing')
          s=s.replace(old_help,new_help,1)

          detach_anchor='async function detachCurrentDevicePush(deleteServerRow=false){'
          need(detach_anchor in s,'detachCurrentDevicePush marker missing')
          pref_helpers='''const DEVICE_PUSH_PREF_PREFIX="anonymous_mailbox_device_push_";
function devicePushPreferenceKey(userId){
  return `${DEVICE_PUSH_PREF_PREFIX}${String(userId||"")}`;
}
function readDevicePushPreference(userId){
  if(!userId)return null;
  const raw=localStorage.getItem(devicePushPreferenceKey(userId));
  if(raw===null)return null;
  return raw==="1";
}
function writeDevicePushPreference(userId,enabled){
  if(!userId)return;
  localStorage.setItem(devicePushPreferenceKey(userId),enabled?"1":"0");
}

'''
          s=s.replace(detach_anchor,pref_helpers+detach_anchor,1)

          refresh_anchor='async function refreshPwaPanel(){'
          need(refresh_anchor in s,'refreshPwaPanel marker missing')
          attach_helpers='''async function attachCurrentDevicePush(adminUser){
  if(!adminUser?.id)throw new Error("admin_required");
  if(!("Notification" in window)||!("PushManager" in window)||!("serviceWorker" in navigator)){
    throw new Error("push_unsupported");
  }
  if(Notification.permission!=="granted")throw new Error("notification_permission_missing");

  const reg=pwaRegistration||await registerPwa()||await navigator.serviceWorker.ready;
  try{await reg.update()}catch{}

  let subscription=await reg.pushManager.getSubscription();
  if(!subscription){
    subscription=await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY)
    });
  }

  const json=subscription.toJSON();
  if(!json.endpoint||!json.keys?.p256dh||!json.keys?.auth){
    throw new Error("subscription_keys_missing");
  }

  const {error}=await supabase.from("push_subscriptions").upsert({
    user_id:adminUser.id,
    endpoint:json.endpoint,
    p256dh:json.keys.p256dh,
    auth_secret:json.keys.auth
  },{onConflict:"endpoint"});
  if(error)throw error;

  return subscription;
}

async function syncCurrentDevicePushPreference(adminUser){
  if(!adminUser?.id)return;
  if(!("Notification" in window)||!("PushManager" in window)||!("serviceWorker" in navigator))return;

  const preference=readDevicePushPreference(adminUser.id);
  const currentSubscription=await getCurrentPushSubscription();

  // Existing users upgrading from older versions: preserve an already-connected device as ON.
  if(preference===null){
    if(Notification.permission==="granted"&&currentSubscription){
      writeDevicePushPreference(adminUser.id,true);
      try{await attachCurrentDevicePush(adminUser)}catch(error){console.warn("push_legacy_sync_failed",error)}
    }
    return;
  }

  if(preference===true){
    if(Notification.permission==="granted"){
      try{await attachCurrentDevicePush(adminUser)}catch(error){console.warn("push_device_restore_failed",error)}
    }
    return;
  }

  if(currentSubscription){
    await detachCurrentDevicePush(true);
  }
}

