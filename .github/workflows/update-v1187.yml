name: Update anonymous to v1.18.7
on:
  push:
    paths:
      - '.github/workflows/update-v1187.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change first bubble to eyes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='text:"先別點"'
          if old not in s:
              raise SystemExit('initial bubble text marker missing')
          s=s.replace(old,'text:"👀"',1)
          if '>v1.18.6</button>' not in s:
              raise SystemExit('version marker missing')
          s=s.replace('>v1.18.6</button>','>v1.18.7</button>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('module script missing')
          js=m.group(1)
          js=re.sub(r'import\s+\{\s*createClient\s*\}\s+from\s+"[^"]+";','const createClient=(...args)=>({});',js,count=1)
          Path('/tmp/check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Update PWA cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          if 'anonymous-mailbox-v1.18.6' not in s:
              raise SystemExit('service worker version marker missing')
          p.write_text(s.replace('anonymous-mailbox-v1.18.6','anonymous-mailbox-v1.18.7',1),encoding='utf-8')
          PY
      - name: Commit v1.18.7
        shell: bash
        run: |
          git config user.name "thfsh112"
          git config user.email "marsmars1000507@gmail.com"
          git rm .github/workflows/update-v1187.yml
          git add index.html service-worker.js
          git commit -m "Change initial admin bubble to eyes"
          git push
