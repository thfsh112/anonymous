name: Update anonymous to v1.18.2
on:
  push:
    paths:
      - '.github/workflows/update-v1182.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated v1.18.2 patch
        run: |
          echo '' | base64 -d > /tmp/v1182.patch
          patch -p1 < /tmp/v1182.patch
      - name: Update service worker cache
        run: |
          sed -i 's/anonymous-mailbox-v1.18.1/anonymous-mailbox-v1.18.2/g' service-worker.js
      - name: Commit update
        run: |
          git config user.name "thfsh112"
          git config user.email "marsmars1000507@gmail.com"
          git rm .github/workflows/update-v1182.yml
          git add index.html service-worker.js
          git commit -m "Update anonymous mailbox to v1.18.2"
          git push
