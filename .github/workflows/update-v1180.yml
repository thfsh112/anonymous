          if old_8 not in s: raise SystemExit("patch block 8 not found")
          s=s.replace(old_8,new_8,1)
          old_9='  if(event==="SIGNED_OUT"){\n    if(realtimeChannel){\n'
          new_9='  if(event==="SIGNED_OUT"){\n    currentAdminRole=null;\n    $("#accountsTab").classList.add("hidden");\n    if(realtimeChannel){\n'
          if old_9 not in s: raise SystemExit("patch block 9 not found")
          s=s.replace(old_9,new_9,1)
