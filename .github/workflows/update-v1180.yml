          PY
      - name: Update service worker cache
        run: sed -i 's/anonymous-mailbox-v1.17.2/anonymous-mailbox-v1.18.0/' service-worker.js
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          js=m.group(1)
          js=re.sub(r'import\s+\{\s*createClient\s*\}\s+from\s+"[^"]+";', 'const createClient=(...args)=>({});', js, count=1)
          Path('/tmp/check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit update
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "actions@github.com"
          git add index.html service-worker.js
          git rm .github/workflows/update-v1180.yml
          git commit -m "Update anonymous mailbox to v1.18.0"
          git push
