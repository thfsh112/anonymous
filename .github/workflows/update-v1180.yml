          new_5='\nasync function callAdminManager(action,payload={}){\n  const {data:{session}}=await supabase.auth.getSession();\n  if(!session?.access_token)throw new Error("not_signed_in");\n\n  const response=await fetch(`${SUPABASE_URL}/functions/v1/manage-admin-users`,{\n    method:"POST",\n    headers:{\n      "Authorization":`Bearer ${session.access_token}`,\n      "apikey":SUPABASE_PUBLISHABLE_KEY,\n      "Content-Type":"application/json"\n    },\n    body:JSON.stringify({action,...payload})\n  });\n\n  let result={};\n  try{result=await response.json()}catch{}\n  if(!response.ok){\n    const error=new Error(result.error||"request_failed");\n    error.code=result.error||"request_failed";\n    throw error;\n  }\n  return result;\n}\n\nfunction adminManagerErrorText(code){\n  return ({\n    owner_only:"只有主帳號可以管理帳號。",\n    invalid_email:"Email 格式不正確。",\n    invalid_password_length:"密碼需為 8～128 碼。",\n    email_exists:"這個 Email 已經有帳號。",\n    create_failed:"新增帳號失敗。",\n    grant_admin_failed:"帳號建立成功但權限設定失敗，已自動回復。",\n    password_reset_failed:"密碼重設失敗。",\n    cannot_delete_self:"不能刪除目前登入的主帳號。",\n    cannot_delete_owner:"不能刪除主帳號。",\n    delete_failed:"刪除帳號失敗。",\n    unauthorized:"登入狀態已失效，請重新登入。"\n  })[code]||"操作失敗，請稍後再試。";\n}\n\nasync function loadAdminRole(){\n  currentAdminRole=null;\n  $("#accountsTab").classList.add("hidden");\n  try{\n    const me=await callAdminManager("me");\n    currentAdminRole=me.role||null;\n    $("#accountsTab").classList.toggle("hidden",currentAdminRole!=="owner");\n    return currentAdminRole;\n  }catch(error){\n    console.warn("load_admin_role_failed",error);\n    return null;\n  }\n}\n\nfunction formatAdminTimestamp(value){\n  if(!value)return"尚未登入";\n  try{return new Date(value).toLocaleString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}catch{return"—"}\n}\n\nasync function loadAdminUsers(){\n  const list=$("#adminUsersList");\n  if(currentAdminRole!=="owner"){\n    list.innerHTML=\'<div class="empty">只有主帳號可以查看帳號清單。</div>\';\n    return;\n  }\n  list.innerHTML=\'<div class="empty">載入中…</div>\';\n  try{\n    const result=await callAdminManager("list");\n    const users=result.users||[];\n    if(!users.length){list.innerHTML=\'<div class="empty">目前沒有管理員帳號。</div>\';return}\n    list.innerHTML=users.map(user=>{\n      const owner=user.role==="owner";\n      return `<article class="admin-user-card" data-admin-user="${escapeHtml(user.id)}">\n        <div class="admin-user-top">\n          <div>\n            <div class="admin-user-email">${escapeHtml(user.email||"未設定 Email")}</div>\n            <div class="admin-user-meta">建立：${escapeHtml(formatAdminTimestamp(user.created_at))}<br>最近登入：${escapeHtml(formatAdminTimestamp(user.last_sign_in_at))}</div>\n          </div>\n          <span class="admin-role-badge ${owner?"owner":""}">${owner?"主帳號":"管理員"}</span>\n        </div>\n        <div class="admin-user-password-row">\n          <input type="password" data-admin-password="${escapeHtml(user.id)}" autocomplete="new-password" placeholder="輸入新的密碼（至少 8 碼）">\n          <button class="secondary" type="button" data-reset-admin-password="${escapeHtml(user.id)}">重設密碼</button>\n        </div>\n        ${owner?"":`<div class="admin-user-actions"><button class="secondary danger" type="button" data-delete-admin="${escapeHtml(user.id)}" data-admin-email="${escapeHtml(user.email||"")}">刪除帳號</button></div>`}\n      </article>`;\n    }).join("");\n  }catch(error){\n    console.error("load_admin_users_failed",error);\n    list.innerHTML=`<div class="empty">${escapeHtml(adminManagerErrorText(error.code))}</div>`;\n  }\n}\n\n$("#createAdminBtn").addEventListener("click",async()=>{\n  const email=$("#newAdminEmail").value.trim();\n  const password=$("#newAdminPassword").value;\n  const confirmPassword=$("#newAdminPasswordConfirm").value;\n  const status=$("#accountCreateStatus");\n\n  if(!email)return toast("請輸入 Email");\n  if(password.length<8)return toast("密碼至少需要 8 碼");\n  if(password!==confirmPassword)return toast("兩次輸入的密碼不一致");\n\n  $("#createAdminBtn").disabled=true;\n  status.textContent="建立中…";\n  try{\n    await callAdminManager("create",{email,password});\n    $("#newAdminEmail").value="";\n    $("#newAdminPassword").value="";\n    $("#newAdminPasswordConfirm").value="";\n    status.textContent="帳號已建立。";\n    toast("已新增後台帳號");\n    await loadAdminUsers();\n  }catch(error){\n    status.textContent=adminManagerErrorText(error.code);\n  }finally{\n    $("#createAdminBtn").disabled=false;\n  }\n});\n\n$("#reloadAdminUsersBtn").addEventListener("click",loadAdminUsers);\n\n$("#adminUsersList").addEventListener("click",async e=>{\n  const resetBtn=e.target.closest("[data-reset-admin-password]");\n  if(resetBtn){\n    const userId=resetBtn.dataset.resetAdminPassword;\n    const input=$(`[data-admin-password="${userId}"]`);\n    const password=input?.value||"";\n    if(password.length<8)return toast("新密碼至少需要 8 碼");\n    resetBtn.disabled=true;\n    resetBtn.textContent="重設中…";\n    try{\n      await callAdminManager("reset_password",{user_id:userId,password});\n      input.value="";\n      toast("密碼已重設");\n    }catch(error){toast(adminManagerErrorText(error.code))}\n    resetBtn.disabled=false;\n    resetBtn.textContent="重設密碼";\n    return;\n  }\n\n  const deleteBtn=e.target.closest("[data-delete-admin]");\n  if(deleteBtn){\n    const userId=deleteBtn.dataset.deleteAdmin;\n    const email=deleteBtn.dataset.adminEmail||"這個帳號";\n    if(!confirm(`確定要刪除 ${email}？\\n刪除後將無法登入後台。`))return;\n    deleteBtn.disabled=true;\n    try{\n      await callAdminManager("delete",{user_id:userId});\n      toast("帳號已刪除");\n      await loadAdminUsers();\n    }catch(error){\n      toast(adminManagerErrorText(error.code));\n      deleteBtn.disabled=false;\n    }\n  }\n});\n\nasync function openAdmin(){\n  const user=await getVerifiedAdmin();\n  if(!user){\n    $("#loginPanel").classList.remove("hidden");\n    $("#adminMain").classList.add("hidden");\n    return;\n  }\n  $("#loginPanel").classList.add("hidden");\n  $("#adminMain").classList.remove("hidden");\n  $("#adminIdentity").textContent=user.email||"管理員";\n  await Promise.all([loadMessages(),loadSettings()]);\n  const role=await loadAdminRole();\n  if(role==="owner")$("#adminIdentity").textContent=`${user.email||"管理員"} · Owner`;\n  startRealtime();\n}\n'
