name: Update anonymous to v1.18.9
on:
  push:
    paths:
      - '.github/workflows/update-v1189.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python3 .github/update_v1189.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m:
              raise SystemExit('module script missing')
          js=m.group(1)
          js=re.sub(r'import\s+\{\s*createClient\s*\}\s+from\s+"[^"]+";','const createClient=(...args)=>({});',js,count=1)
          Path('/tmp/check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Update PWA cache
        run: python3 -c "from pathlib import Path; p=Path('service-worker.js'); s=p.read_text(encoding='utf-8'); assert 'anonymous-mailbox-v1.18.8' in s; p.write_text(s.replace('anonymous-mailbox-v1.18.8','anonymous-mailbox-v1.18.9',1),encoding='utf-8')"
      - name: Commit v1.18.9
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/update_v1189.py .github/workflows/update-v1189.yml
          git add index.html service-worker.js
          git commit -m "Update anonymous mailbox to v1.18.9"
          git push
