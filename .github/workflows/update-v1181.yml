name: Update anonymous to v1.18.1
on:
  push:
    paths:
      - '.github/workflows/update-v1181.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v1181.patch
          git apply --unidiff-zero /tmp/v1181.patch
      - name: Update service worker cache
        run: sed -i 's/anonymous-mailbox-v1.18.0/anonymous-mailbox-v1.18.1/g' service-worker.js
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          js=m.group(1)
          js=re.sub(r'import\s+\{\s*createClient\s*\}\s+from\s+"[^"]+";', 'const createClient=(...args)=>({});', js, count=1)
          Path('/tmp/check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit update
        run: |
          git config user.name 'thfsh112'
          git config user.email 'marsmars1000507@gmail.com'
          rm -f .github/workflows/update-v1181.yml
          git add index.html service-worker.js .github/workflows/update-v1181.yml
          git commit -m 'Update anonymous mailbox to v1.18.1'
          git push
