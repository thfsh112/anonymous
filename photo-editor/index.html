<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2ed"><title>MARSEDIT · 免費手機修圖</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header><div><div class="eyebrow">FREE PHOTO EDITOR</div><h1>MARSEDIT</h1></div><button id="resetTop" class="ghost">重設</button></header>
<main><section class="stage"><div id="empty" class="empty"><div class="empty-badge">PHOTO EDITOR</div><div class="empty-icon">＋</div><h2>把手機照片變成<br>另一台相機拍的樣子</h2><p>不用真正的底片相機，也能做出不同年代的色彩與質感。</p><label class="pick">選擇照片<input id="file" type="file" accept="image/*"></label><div class="empty-features"><span>8 種相機</span><span>13 種濾鏡</span><span>14 項調整</span></div></div><canvas id="canvas" hidden></canvas><div class="stage-tools" hidden id="stageTools"><button id="beforeBtn">按住看原圖</button></div></section>
<section class="editor" hidden id="editor"><div class="tabs"><button class="tab active" data-tab="adjust">調整</button><button class="tab" data-tab="filter">濾鏡</button><button class="tab" data-tab="camera">相機</button><button class="tab" data-tab="effect">效果</button></div>
<div id="adjustPanel" class="panel"></div><div id="filterPanel" class="panel hidden"></div><div id="cameraPanel" class="panel hidden"></div><div id="effectPanel" class="panel hidden"></div>
<div class="bottom-actions"><button id="change" class="secondary">換照片</button><button id="cloud" class="secondary">雲端照片</button><button id="download" class="primary">儲存照片</button></div>
<div id="cloudPanel" class="cloud-panel" hidden>
<div class="cloud-head"><div><strong>我的雲端照片</strong><small>這台裝置的雲端相簿</small></div><button id="cloudRefresh" class="cloud-refresh">重新整理</button></div>
<div id="cloudStatus" class="cloud-status">尚未載入</div><div id="cloudGallery" class="cloud-gallery"></div>
</div></section></main><footer>MARSEDIT · Your camera is already in your phone.</footer></div><script src="script.js?v=20260930-cloud1"></script></body></html>
